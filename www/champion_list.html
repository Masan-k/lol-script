<!DOCTYPE HTML>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>champion list</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    h1{color:blue;}
    .container{
      display: grid;
      gap: 8px;
    }
    .card {
      display: flex;
      box-sizing: border-box;
      padding: 4px;
      text-align: center;
      align-items: center;
    }
   
    .card img {
      display: block;
      max-width: 100%;      /* 親（.item）の幅に合わせる */
      height: auto;     /* 縦横比を維持して縮小 */
    }

    .card-text {
      display: block;
      box-sizing: border-box;
      text-align: left;
      font-size: 0.8rem;
    }

    .container.names .card {
      display: flex;
    }
    .container.icons .card {
      display: block;
    }
    .container.icons .card img {
      width: 100%;
    }
    @media (max-width:300px){
      .container{grid-template-columns: repeat(1, 1fr);}
    } 
    @media (min-width: 301px) and (max-width:600px){
      .container{grid-template-columns: repeat(2, 1fr);}
    }
    @media (min-width:601px)  and (max-width:900px){
      .container{grid-template-columns: repeat(3, 1fr);}
    }
    @media (min-width:901px)  and (max-width:1200px){
      .container{grid-template-columns: repeat(4, 1fr);}
    }
    @media (min-width: 1201px){
      .container{grid-template-columns: repeat(5, 1fr);}
    }
     
  </style>
</head>


<body>
<h1>CHAMPION LIST</h1>
<button id="buttonHiddenToggle" onclick="clickHiddenToggle()">HIDDEN NAME</button>
<div id="container" class="container"></div>

<script>
  let champion = null;
  const container = document.getElementById('container');
  const eleHiddenToggle = document.getElementById('buttonHiddenToggle');

  function renderChampion(showName){
    if (showName) {
      container.classList.add('names');
      container.classList.remove('icons');
    } else {
      container.classList.add('icons');
      container.classList.remove('names');
    }

    container.innerHTML = '';

    for(let key in champion){
      const image_path = "images/" + champion[key].id + ".png"

      let html = '<div class="card">';
      if(showName){
        html += '<img src="' + image_path + '">';
        html += '<a class="card-text">' + champion[key].name + '<br>(' + champion[key].id + ')<br>'+ champion[key].tags +'</a>';
      }else{
        html += '<img src="' + image_path + '" title="'+ champion[key].name + '(' +champion[key].id + ')'+ champion[key].tags+'">';
      }
      html += '</div>';
      container.innerHTML += html;
    }

  }

  function clickHiddenToggle(){ 

    if(eleHiddenToggle.textContent == "HIDDEN NAME"){
      eleHiddenToggle.textContent = "SHOW NAME";
      renderChampion(false);

    }else{
      eleHiddenToggle.textContent = "HIDDEN NAME";
      renderChampion(true);
    }

  }
  let jsonFile = null;
  let isOpenFile = false;

  let requestURL = './public/champion.json';
  let request = new XMLHttpRequest();
  request.open('GET', requestURL);
  request.responseType = 'json';
  request.send();

  request.onload = function () {
    isOpenFile = true;
    jsonFile = request.response;
    champion = jsonFile['data'];

    renderChampion(true);
  }

</script>
</body>
</html>
