<!DOCTYPE HTML>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>champion list</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    h1{color:blue;}
    .container{
      display: flex;
      flex-wrap: wrap;
    }
    /* 1チャンプ = カード1枚 */
    .card {
      box-sizing: border-box;
      padding: 4px;
      text-align: center;
    }
   
    .card img {
      display: block;
      max-width: 100%;      /* 親（.item）の幅に合わせる */
      height: auto;     /* 縦横比を維持して縮小 */
    }

    .card-text {
      display: block;
      box-sizing: border-box;
      text-align: left;
      /*font-size: 0.8rem;*/
    }
    @media (max-width:300px){
      .card{
        flex: 0 0 50%;
        max-width: 50%;
      }
    }
    @media (min-width: 301px) and (max-width:600px){
      .card{
        flex: 0 0 33.33%;
        max-width: 33.33%;
      }
    }

    @media (min-width:601px){
      .card{
        flex: 0 0 25%;
        max-width: 25%;
      }
    }
  </style>
</head>


<body>
<h1>CHAMPION LIST</h1>
<button id="buttonHiddenToggle" onclick="clickHiddenToggle()">HIDDEN NAME</button>
<div id="container" class="container"></div>

<script>
  let champion = null;
  const container = document.getElementById('container');
  const eleHiddenToggle = document.getElementById('buttonHiddenToggle');

  function renderChampion(showName){
    container.innerHTML = '';

    for(let key in champion){
      const image_path = "images/" + champion[key].id + ".png"

      container.innerHTML += '<div class="card">';
      if(showName){
        container.innerHTML += '<img src="' + image_path + '">';
        container.innerHTML += '<a class="card-text">' + champion[key].name + '<br>(' + champion[key].id + ')<br>'+ champion[key].tags +'</a>';
      }else{
        container.innerHTML += '<img src="' + image_path + '" title="'+ champion[key].name + '(' +champion[key].id + ')'+ champion[key].tags+'">';
      }
      container.innerHTML += '</div>';
    }
  }

  function clickHiddenToggle(){ 

    if(eleHiddenToggle.textContent == "HIDDEN NAME"){
      eleHiddenToggle.textContent = "SHOW NAME";
      renderChampion(false);

    }else{
      eleHiddenToggle.textContent = "HIDDEN NAME";
      renderChampion(true);
    }

  }
  let jsonFile = null;
  let isOpenFile = false;

  let requestURL = './public/champion.json';
  let request = new XMLHttpRequest();
  request.open('GET', requestURL);
  request.responseType = 'json';
  request.send();

  request.onload = function () {
    isOpenFile = true;
    jsonFile = request.response;
    champion = jsonFile['data'];

    renderChampion(true);
  }

</script>
</body>
</html>
